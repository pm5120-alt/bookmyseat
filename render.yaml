services:
  - type: keyvalue
    name: bookmyseat-queue
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: bookmyseat
    runtime: python
    region: singapore
    plan: 1c-2g
    numInstances: 1
    buildCommand: >-
      pip install -r requirements.txt &&
      DJANGO_DEBUG=true DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /
    disk:
      name: bookmyseat-files
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bookmyseat-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: bookmyseat-queue
          property: connectionString
      - key: PRIVATE_MEDIA_ROOT
        value: /data/private-media
      - key: MEDIA_ROOT
        value: /data/media
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: bookmyseat-db
    databaseName: bookmyseat
    user: bookmyseat
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
