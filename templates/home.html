{% extends "users/basic.html" %} {% block content %}
<style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #f8f9fa;
    }
    .section-title {
      font-size: 24px;
      font-weight: bold;
      margin: 30px 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #007bff;
      color: #333;
    }
    .card {
      transition: transform 0.3s, box-shadow 0.3s;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .card-img-top {
      object-fit: cover;
    }
    .card-body {
      background-color: #fff;
      padding: 15px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .card-text {
      font-size: 14px;
      color: #666;
    }
    .carousel-item img {
      object-fit: cover;
    }
    .carousel-caption {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      padding: 20px;
    }
    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
    }
    .btn-primary:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }
  </style>
  
  <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators">
      <li
        data-target="#carouselExampleIndicators"
        data-slide-to="0"
        class="active"
      ></li>
      <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
      <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
    </ol>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          class="d-block w-100"
          src="https://assets-in.bmscdn.com/promotions/cms/creatives/1728390794440_bandlanddesktop.jpg"
          alt="First slide"
          height="300"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block w-100"
          src="https://assets-in.bmscdn.com/promotions/cms/creatives/1726036566435_playcardnewweb.jpg"
          alt="Second slide"
          height="300"
        />
      </div>
      <div class="carousel-item">
        <img
          class="d-block w-100"
          src="https://assets-in.bmscdn.com/promotions/cms/creatives/1729172081740_sorcar1240x300.jpg"
          alt="Third slide"
          height="300"
        />
      </div>
    </div>
    <a
      class="carousel-control-prev"
      href="#carouselExampleIndicators"
      role="button"
      data-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a
      class="carousel-control-next"
      href="#carouselExampleIndicators"
      role="button"
      data-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
  
  <div class="container mt-4">
    {% if not user.is_authenticated %}
    <div class="alert alert-info" role="alert">
      <a href="{% url 'login' %}" class="alert-link">Login</a> or
      <a href="{% url 'register' %}" class="alert-link">Register</a> to continue.
    </div>
    {% endif %}
  
    <div class="section-title">Recommended Movies</div>
    <div class="row">
        {% if movies %}
      {% for movie in movies|slice:":4" %}
      <div class="col-md-3 col-sm-6">
        <a href="{% url 'theater_list' movie.id %}" class="text-decoration-none">
          <div class="card h-100">
            <img src="{{ movie.display_poster_url }}" class="card-img-top" alt="Poster for {{ movie.name }}" width="200" height="300" loading="lazy" style="width:100%;height:300px;object-fit:cover;background:#15192b" />
            <div class="card-body d-flex flex-column justify-content-between">
              <h5 class="card-title text-center">{{ movie.name }}</h5>
              <p class="card-text text-center">{{ movie.description }}</p>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
      {% endif %}
    </div>
  
  </div>
  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script>
    $(document).ready(function () {
      $(".card").hover(
        function () {
          $(this).addClass("shadow-lg").css("cursor", "pointer");
        },
        function () {
          $(this).removeClass("shadow-lg");
        }
      );
    });
  </script>

{% endblock %}
