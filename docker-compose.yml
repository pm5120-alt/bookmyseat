services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookmyseat
      POSTGRES_USER: bookmyseat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmyseat -d bookmyseat"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bookmyseat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/bookmyseat
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PRIVATE_MEDIA_ROOT: /data/private-media
    command: sh -c "python manage.py migrate --noinput && gunicorn bookmyseat.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    volumes: ["private_tickets:/data/private-media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bookmyseat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/bookmyseat
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PRIVATE_MEDIA_ROOT: /data/private-media
    command: ["celery", "-A", "bookmyseat", "worker", "--loglevel=INFO"]
    volumes: ["private_tickets:/data/private-media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A bookmyseat inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bookmyseat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/bookmyseat
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["celery", "-A", "bookmyseat", "beat", "--loglevel=INFO"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; s=pathlib.Path('/proc/1/cmdline').read_bytes(); sys.exit(0 if b'celery' in s and b'beat' in s else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  redis_data:
  private_tickets:
