services:
  - type: web
    name: bookmyseat-demo
    runtime: python
    region: singapore
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      export DJANGO_DEBUG=true &&
      export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" &&
      python manage.py migrate --noinput &&
      python manage.py shell -c 'import os; from django.core.management import call_command; from movies.models import Movie; demo_mode = os.environ.get("BOOKMYSEAT_DEMO_MODE", "").lower() == "true"; movie_count = Movie.objects.count(); print(f"Demo seed guard: demo_mode={demo_mode}, movies={movie_count}"); call_command("seed_demo_catalogue", yes=True) if demo_mode and movie_count == 0 else print("Demo seed skipped: demo mode disabled or catalogue already populated.")' &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn bookmyseat.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: BOOKMYSEAT_DEMO_MODE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-demo-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.locmem.EmailBackend
      - key: CELERY_BROKER_URL
        value: memory://
      - key: CELERY_RESULT_BACKEND
        value: cache+memory://

databases:
  - name: bookmyseat-demo-db
    databaseName: bookmyseat_demo
    user: bookmyseat_demo
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
