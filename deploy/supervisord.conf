[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/bookmyseat-supervisord.pid
loglevel=info

[program:web]
command=gunicorn bookmyseat.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 2 --timeout 60
directory=/opt/render/project/src
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery-worker]
command=celery -A bookmyseat worker --loglevel=INFO --concurrency=1
directory=/opt/render/project/src
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery-beat]
command=celery -A bookmyseat beat --loglevel=INFO --schedule=/data/private-media/celerybeat-schedule
directory=/opt/render/project/src
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
